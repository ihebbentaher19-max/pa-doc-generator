trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  dotnetVersion: "8.0.x"
  nodeVersion: "20.x"

  azureSubscriptionServiceConnection: "ai document generation service connection"
  backendAppServiceName: "documentation-powerautomate"

stages:

# =====================================================================
# BACKEND
# =====================================================================

- stage: Backend
  displayName: "Backend - Build & Test"

  jobs:

  - job: BuildBackend

    steps:

    - task: UseDotNet@2
      displayName: "Installer .NET SDK"

      inputs:
        version: $(dotnetVersion)

    - script: |
        dotnet restore backend/PADocGenerator.sln
      displayName: Restore

    - script: |
        dotnet build backend/PADocGenerator.sln --configuration Release --no-restore
      displayName: Build

    - script: |
        dotnet test backend/PADocGenerator.Tests/PADocGenerator.Tests.csproj --configuration Release --no-build --logger trx
      displayName: Tests

    - task: PublishTestResults@2
      condition: succeededOrFailed()

      inputs:
        testResultsFormat: VSTest
        testResultsFiles: "**/*.trx"

    - script: |
        dotnet publish backend/PADocGenerator.Api/PADocGenerator.Api.csproj \
          --configuration Release \
          --no-build \
          --output $(Build.ArtifactStagingDirectory)/backend
      displayName: Publish Backend

    - publish: $(Build.ArtifactStagingDirectory)/backend
      artifact: backend-publish

# =====================================================================
# FRONTEND
# =====================================================================

- stage: Frontend
  displayName: "Frontend - React"

  jobs:

  - job: BuildFrontend

    steps:

    - task: NodeTool@0
      displayName: "Installer Node"

      inputs:
        versionSpec: $(nodeVersion)

    - script: npm ci
      workingDirectory: frontend
      displayName: Installer dépendances

    - script: npm run lint
      workingDirectory: frontend
      displayName: Lint

    - script: npm run build
      workingDirectory: frontend
      displayName: Build React

    - publish: frontend/dist
      artifact: frontend-dist

# =====================================================================
# DEPLOIEMENT
# =====================================================================

- stage: Deploy
  displayName: "Déploiement (production)"
  dependsOn:
  - Backend
  - Frontend
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployBackendAndFrontend
    displayName: "Déployer backend + frontend"
    environment:
      name: "production"
    strategy:
      runOnce:
        deploy:
          steps:
          # 1. Télécharger l'artefact Backend
          - task: DownloadPipelineArtifact@2
            displayName: "Télécharger l'artefact Backend"
            inputs:
              artifact: 'backend-publish'
              path: '$(Pipeline.Workspace)/backend-publish'

          # 2. Déployer Backend sur Azure App Service
          - task: AzureWebApp@1
            displayName: "Deployer le backend sur Azure App Service"
            inputs:
              azureSubscription: "$(azureSubscriptionServiceConnection)"
              appName: "$(backendAppServiceName)"
              package: "$(Pipeline.Workspace)/backend-publish"

          # 3. Télécharger l'artefact Frontend
          - task: DownloadPipelineArtifact@2
            displayName: "Télécharger l'artefact Frontend"
            inputs:
              artifact: 'frontend-dist'
              path: '$(Pipeline.Workspace)/frontend-dist'

          # 4. Déployer Frontend sur Azure Static Web Apps
          - task: AzureStaticWebApp@0
            displayName: "Deployer le frontend sur Azure Static Web Apps"
            inputs:
              app_location: "$(Pipeline.Workspace)/frontend-dist"
              skip_app_build: true
              azure_static_web_apps_api_token: "$(AZURE_STATIC_WEB_APPS_API_TOKEN)"